name: TingDu
options:
  bundleIdPrefix: com.tingdu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ReaderCore:
    path: Packages/ReaderCore

targets:
  TingDu:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tingdu.reader
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""

schemes:
  TingDu:
    build:
      targets:
        TingDu: all
    run:
      config: Debug
    test:
      config: Debug
