name: TingDu
options:
  bundleIdPrefix: com.tingdu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ReaderCore:
    path: Packages/ReaderCore

targets:
  TingDu:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
    dependencies:
      - package: ReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tingdu.reader
        MARKETING_VERSION: "1.2.3"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        # P0#4（v1.2.0）：书源多为明文 http，iOS 默认 ATS 会直接拦截（需求 4.10 门槛）。
        # v1.2.2 修正：INFOPLIST_KEY_NSAppTransportSecurity_* 不是 Xcode 支持的生成键，
        # 实测不进产物（v1.2.2 build 2 IPA 的 Info.plist 无此键）。改为实体 Info.plist
        # 承载，与 GENERATE_INFOPLIST_FILE 合并生成。

schemes:
  TingDu:
    build:
      targets:
        TingDu: all
    run:
      config: Debug
    test:
      config: Debug
