name: TingDu
options:
  bundleIdPrefix: com.tingdu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ReaderCore:
    path: Packages/ReaderCore

targets:
  TingDu:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tingdu.reader
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        # P0#4（v1.2.0）：书源多为明文 http，iOS 默认 ATS 会直接拦截（需求 4.10 门槛）。
        # 阅读器类 App 通行做法：放开明文。走 xcconfig 里的 Info.plist 键生成器，
        # 以避免 GENERATE_INFOPLIST_FILE 与手写 Info.plist 并存。
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES

schemes:
  TingDu:
    build:
      targets:
        TingDu: all
    run:
      config: Debug
    test:
      config: Debug
